name: CI

on:
  push:
    branches:
      - develop
      - feature
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn test

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module/frontend-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: module/frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: Run production build
        run: npm run build

  compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate local compose config
        run: docker compose -f module/docker/local/docker-compose.yml config

  module-export:
    name: Module Export Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: module/frontend-web/package-lock.json

      - name: Validate script syntax
        run: |
          bash -n scripts/module-export.sh
          bash -n scripts/module-manifest-diff.sh
          bash -n scripts/module-release-check.sh
          bash -n scripts/module-verify-import.sh

      - name: Validate module catalog resource
        run: |
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path("module/backend/module-system/src/main/resources/module-catalog.tsv")
          rows = [
              line.split("\t")
              for line in catalog.read_text(encoding="utf-8").splitlines()
              if line and not line.startswith("#")
          ]
          assert len(rows) == 17
          assert all(len(row) == 9 for row in rows)
          assert [row[0] for row in rows[:3]] == ["auth", "organization", "workflow"]
          assert any(row[0] == "payroll" and row[6] == "auth,organization,attendance,leave,finance" for row in rows)
          PY

      - name: Validate payroll dependency plan
        run: |
          scripts/module-export.sh --modules payroll > /tmp/module-export-plan.txt
          grep -q "module/backend/module-payroll" /tmp/module-export-plan.txt
          grep -q "module/backend/module-leave" /tmp/module-export-plan.txt
          grep -q "classpath:db/migration/payroll" /tmp/module-export-plan.txt

      - name: Validate JSON manifest output
        run: |
          scripts/module-export.sh --modules payroll --format json > /tmp/module-export.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/module-export.json").read_text())
          assert manifest["schemaVersion"] == "1.1"
          assert manifest["generatedAt"].endswith("Z")
          assert manifest["source"]["branch"]
          assert manifest["source"]["commit"]
          assert isinstance(manifest["source"]["dirty"], bool)
          assert manifest["requestedModules"] == ["payroll"]
          assert manifest["requiredModules"] == ["auth", "organization", "attendance", "workflow", "leave", "finance", "payroll"]
          assert "module/backend/module-payroll" in manifest["backendModules"]
          assert "module/frontend-web/src/features/payroll" in manifest["frontendFeatures"]
          assert "classpath:db/migration/payroll" in manifest["flywayLocations"]
          assert "module/backend/module-common" in manifest["copyPaths"]
          assert any(module["module"] == "payroll" for module in manifest["modules"])
          PY

      - name: Validate clean export guard
        run: |
          scripts/module-export.sh --modules crm --format json --require-clean > /tmp/module-export-clean.json
          touch .module-export-dirty-smoke
          if scripts/module-export.sh --modules crm --format json --require-clean >/tmp/module-export-dirty.json 2>/tmp/module-export-dirty.err; then
            echo "--require-clean should fail when the repository has untracked files" >&2
            exit 1
          fi
          grep -q "Refusing formal export" /tmp/module-export-dirty.err
          rm -f .module-export-dirty-smoke

      - name: Validate Markdown catalog output
        run: |
          scripts/module-export.sh --all --format markdown > /tmp/module-catalog.md
          diff -u docs/module-catalog.md /tmp/module-catalog.md

      - name: Validate config snippet output
        run: |
          scripts/module-export.sh --modules payroll --format config > /tmp/module-export-config.yml
          grep -q "classpath:db/migration/payroll" /tmp/module-export-config.yml
          grep -q "payroll: true" /tmp/module-export-config.yml
          grep -q "leave: true" /tmp/module-export-config.yml
          grep -q "project: false" /tmp/module-export-config.yml

      - name: Validate rsync command output
        run: |
          scripts/module-export.sh --modules CRM,unknown-module --format rsync --target /tmp/module-target > /tmp/module-export-rsync.txt
          grep -q "Unknown modules were ignored: unknown-module" /tmp/module-export-rsync.txt
          grep -q "module/frontend-web/src/features/crm" /tmp/module-export-rsync.txt
          grep -q -- "--exclude target --exclude node_modules --exclude dist" /tmp/module-export-rsync.txt

      - name: Validate execute copy smoke
        run: |
          scripts/module-export.sh --modules crm --target /tmp/module-export-copy --execute
          test -d /tmp/module-export-copy/module/backend/module-crm
          test -d /tmp/module-export-copy/module/backend/module-auth
          test -d /tmp/module-export-copy/module/frontend-web/src/features/crm
          test -f /tmp/module-export-copy/module/docker/local/docker-compose.yml
          test -f /tmp/module-export-copy/module/module-bundle-manifest.json
          test -f /tmp/module-export-copy/module/MODULE_BUNDLE.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/module-export-copy/module/module-bundle-manifest.json").read_text())
          assert manifest["schemaVersion"] == "1.1"
          assert manifest["requestedModules"] == ["crm"]
          assert manifest["requiredModules"] == ["auth", "organization", "crm"]
          assert manifest["source"]["commit"]
          assert manifest["source"]["shortCommit"]
          PY

      - name: Validate manifest diff output
        run: |
          scripts/module-export.sh --modules crm --format json > /tmp/module-export-crm.json
          scripts/module-export.sh --modules payroll --format json > /tmp/module-export-payroll.json
          scripts/module-manifest-diff.sh --from /tmp/module-export-crm.json --to /tmp/module-export-payroll.json > /tmp/module-manifest-diff.txt
          grep -q "requiredModules:" /tmp/module-manifest-diff.txt
          grep -q "module/backend/module-payroll" /tmp/module-manifest-diff.txt
          scripts/module-manifest-diff.sh --from /tmp/module-export-crm.json --to /tmp/module-export-crm.json > /tmp/module-manifest-no-change.txt
          grep -q "No module manifest changes." /tmp/module-manifest-no-change.txt
          scripts/module-manifest-diff.sh --from /tmp/module-export-crm.json --to /tmp/module-export-payroll.json --format json > /tmp/module-manifest-diff.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          diff = json.loads(Path("/tmp/module-manifest-diff.json").read_text())
          assert diff["schemaVersion"] == "1.0"
          assert diff["hasChanges"] is True
          assert "payroll" in diff["changes"]["requiredModules"]["added"]
          PY

      - name: Validate release check smoke
        run: |
          scripts/module-release-check.sh --modules crm --target /tmp/module-release-check-smoke --skip-backend --skip-frontend --skip-compose
          test -f /tmp/module-release-check-smoke/module/module-bundle-manifest.json
          grep -q '"dirty": false' /tmp/module-release-check-smoke/module/module-bundle-manifest.json

      - name: Validate portable import builds
        run: |
          for module in crm payroll; do
            target="/tmp/module-import-${module}-smoke"
            rm -rf "$target"
            scripts/module-export.sh --modules "$module" --target "$target" --execute
            test ! -d "$target/module/backend/app/target"
            grep -q "<module>module-${module}</module>" "$target/module/backend/pom.xml"
            scripts/module-verify-import.sh --target "$target"
          done

  docs:
    name: Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate module portability guide
        run: |
          test -f docs/module-portability-guide.md
          test -f docs/module-catalog.md
          test -f docs/module-release-guide.md
          test -f CHANGELOG.md
          test -f ai-handoff.md
          test -f ai-module-planning.md
          test -f ai-module-change-protocol.md
          grep -q "module-v2026.05.12.1" ai-module-planning.md
          grep -q "reference/模塊化組件/ai-handoff.md" ai-handoff.md
          grep -q "module-release-check.sh" ai-handoff.md
          grep -q "/Users/wei/Desktop/code/模塊化組件" ai-handoff.md
          grep -q "ai-handoff.md" ai-module-planning.md
          grep -q "/Users/wei/Desktop/code/模塊化組件" ai-module-planning.md
          grep -q "/Users/wei/Desktop/code/模塊化組件" ai-module-change-protocol.md
          grep -q "scripts/module-export.sh" ai-module-planning.md
          grep -q "scripts/module-manifest-diff.sh" ai-module-change-protocol.md
          grep -q "scripts/module-release-check.sh" ai-module-change-protocol.md
          grep -q "scripts/module-export.sh --modules payroll --format json" docs/module-portability-guide.md
          grep -q "scripts/module-export.sh --all --format markdown" docs/module-portability-guide.md
          grep -q "module/module-bundle-manifest.json" docs/module-portability-guide.md
          grep -q "scripts/module-manifest-diff.sh" docs/module-portability-guide.md
          grep -q "scripts/module-release-check.sh" docs/module-portability-guide.md
          grep -q "scripts/module-verify-import.sh --target" docs/module-portability-guide.md
          grep -q "scripts/module-export.sh --modules payroll --format config" docs/module-portability-guide.md
          grep -q "scripts/module-export.sh --modules payroll --target /path/to/target-project --execute" docs/module-portability-guide.md
          grep -q "mvn -f module/backend/pom.xml test" docs/module-portability-guide.md
          grep -q "npm audit --audit-level=high" docs/module-portability-guide.md
          grep -q "module-verify-import.sh" docs/module-release-guide.md
          grep -q "module-manifest-diff.sh" docs/module-release-guide.md
          grep -q "module-release-check.sh" docs/module-release-guide.md
          grep -q "ai-handoff.md" docs/module-release-guide.md
          grep -q "ai-module-planning.md" docs/module-release-guide.md
          grep -q "ai-handoff.md" docs/module-portability-guide.md
          grep -q "ai-module-change-protocol.md" docs/module-portability-guide.md
          grep -q "module-vYYYY.MM.DD.N" docs/module-release-guide.md
          grep -q "source.shortCommit" docs/module-release-guide.md
          grep -q "module-bundle-manifest.json" CHANGELOG.md

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - compose
      - module-export
      - docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build local images
        run: docker compose -f module/docker/local/docker-compose.yml build backend frontend
